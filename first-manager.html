<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06152f">
<title>Premier Manager • Super Support IT</title>
<link rel="stylesheet" href="./app.css">
<style>
.step{display:flex;gap:10px;align-items:flex-start;margin:10px 0;padding:10px;border:1px solid #dce6f1;border-radius:12px;background:#f8fbff}
.step b{display:grid;place-items:center;min-width:26px;height:26px;border-radius:50%;background:#1769ab;color:#fff}
.status{margin-top:12px;padding:12px;border-radius:10px;font-size:12px;display:none;white-space:pre-wrap}
.status.show{display:block}.status.ok{background:#eaf8f1;border:1px solid #bfe7d2;color:#0b6e4a}.status.err{background:#fff3f4;border:1px solid #f2c5cb;color:#9d2637}
</style>
</head>
<body>
<section class="authWrap">
  <div class="authCard">
    <div class="brandLine">
      <div class="dots"><i></i><i></i><i></i></div>
      <div><h1>Premier accès Manager</h1><p>Une seule opération : créer ton compte puis ouvrir Super Support IT.</p></div>
    </div>

    <div class="step"><b>1</b><div><strong>Compte Manager</strong><div class="muted">L'adresse est déjà renseignée.</div></div></div>
    <div class="step"><b>2</b><div><strong>Choisis ton mot de passe</strong><div class="muted">Minimum 10 caractères.</div></div></div>
    <div class="step"><b>3</b><div><strong>Clique sur Créer et me connecter</strong><div class="muted">La page teste immédiatement la connexion.</div></div></div>

    <form id="firstManagerForm">
      <div class="field"><label>Nom</label><input id="displayName" class="input" value="Olivier Marchegay" required></div>
      <div class="field"><label>Email Manager</label><input id="email" class="input" type="email" value="olivier.marchegay@securitas.fr" required></div>
      <div class="field"><label>Mot de passe</label><input id="password" class="input" type="password" minlength="10" required autocomplete="new-password" placeholder="Ton mot de passe"></div>
      <button id="go" class="btn success" type="submit" style="width:100%;font-size:15px;padding:12px">Créer le Manager et me connecter</button>
    </form>

    <div id="status" class="status"></div>
    <a href="./index.html" class="btn ghost" style="display:block;text-align:center;text-decoration:none;margin-top:10px">Retour à la connexion</a>
  </div>
</section>

<script>
const PROJECT='ilxdqvbcvcwfklvkyfoj';
const URL='https://'+PROJECT+'.supabase.co';
const KEY='sb_publishable_7f0bDxce4zdPCr5_4go4Wg_S6wlEPFY';
const form=document.getElementById('firstManagerForm');
const statusBox=document.getElementById('status');
const button=document.getElementById('go');

function status(text,ok=false){
  statusBox.textContent=text;
  statusBox.className='status show '+(ok?'ok':'err');
}
async function jsonResponse(r){
  let data={};
  try{ data=await r.json(); }catch{}
  if(!r.ok) throw new Error(data.error_description||data.msg||data.error||('HTTP '+r.status));
  return data;
}

form.addEventListener('submit',async e=>{
  e.preventDefault();
  button.disabled=true;
  button.textContent='Création du Manager...';
  statusBox.className='status';
  const email=document.getElementById('email').value.trim().toLowerCase();
  const password=document.getElementById('password').value;
  const display_name=document.getElementById('displayName').value.trim();

  try{
    // Création admin via Edge Function serveur : le mot de passe n'est jamais stocké dans GitHub.
    const createResp=await fetch(URL+'/functions/v1/bootstrap-manager',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'apikey':KEY,
        'Authorization':'Bearer '+KEY
      },
      body:JSON.stringify({email,password,display_name})
    });
    const createData=await jsonResponse(createResp);

    button.textContent='Vérification de la connexion...';

    // Test réel des identifiants via Supabase Auth.
    const loginResp=await fetch(URL+'/auth/v1/token?grant_type=password',{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':KEY},
      body:JSON.stringify({email,password})
    });
    const session=await jsonResponse(loginResp);

    if(!session.access_token || !session.user) throw new Error('Supabase n’a pas retourné de session.');

    // Format de stockage utilisé par Supabase JS v2.
    const expiresAt=Math.floor(Date.now()/1000)+(session.expires_in||3600);
    localStorage.setItem('sb-'+PROJECT+'-auth-token',JSON.stringify({
      access_token:session.access_token,
      token_type:session.token_type||'bearer',
      expires_in:session.expires_in||3600,
      expires_at:expiresAt,
      refresh_token:session.refresh_token,
      user:session.user
    }));

    status('Compte Manager créé et connexion vérifiée. Ouverture de Super Support IT…',true);
    setTimeout(()=>location.href='./index.html',1000);
  }catch(err){
    const msg=String(err?.message||err);
    if(/already|exists|déjà/i.test(msg)){
      status('Un Manager existe déjà. Retourne à la page principale et utilise Accès Manager.');
    }else{
      status('Échec : '+msg+'\n\nLe compte n’a pas été validé. Ne change rien ailleurs : donne-moi simplement ce message d’erreur.');
    }
  }finally{
    button.disabled=false;
    button.textContent='Créer le Manager et me connecter';
  }
});
</script>
</body>
</html>
