<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06152f">
<title>Initialisation Manager • Super Support IT</title>
<link rel="stylesheet" href="./app.css">
</head>
<body>
<section class="authWrap">
  <div class="authCard">
    <div class="brandLine">
      <div class="dots"><i></i><i></i><i></i></div>
      <div><h1>Créer le premier Manager</h1><p>Page d'installation dédiée.</p></div>
    </div>
    <div class="notice">Cette page fonctionne uniquement tant qu'aucun Manager n'a encore été créé.</div>
    <form id="setupOnlyForm">
      <div class="field"><label>Code initial</label><input id="code" class="input" required></div>
      <div class="field"><label>Nom affiché</label><input id="name" class="input" required></div>
      <div class="field"><label>Email Manager</label><input id="email" class="input" type="email" required></div>
      <div class="field"><label>Mot de passe</label><input id="password" class="input" type="password" minlength="10" required></div>
      <button id="submitBtn" class="btn success" type="submit" style="width:100%">Créer le compte Manager</button>
    </form>
    <div id="msg" class="notice hidden" style="margin-top:12px"></div>
    <a href="./index.html" class="btn ghost" style="display:block;text-align:center;text-decoration:none;margin-top:10px">Retour à la connexion</a>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://ilxdqvbcvcwfklvkyfoj.supabase.co';
const SUPABASE_KEY='sb_publishable_7f0bDxce4zdPCr5_4go4Wg_S6wlEPFY';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const form=document.getElementById('setupOnlyForm');
const msg=document.getElementById('msg');
const btn=document.getElementById('submitBtn');
function show(t,ok=false){msg.textContent=t;msg.classList.remove('hidden');msg.style.background=ok?'#eaf8f1':'#fff3f4';msg.style.borderColor=ok?'#bfe7d2':'#f2c5cb';msg.style.color=ok?'#0b6e4a':'#9d2637'}
form.addEventListener('submit',async e=>{
 e.preventDefault();
 btn.disabled=true;btn.textContent='Création en cours...';
 try{
  const body={
   bootstrap:document.getElementById('code').value.trim(),
   email:document.getElementById('email').value.trim(),
   password:document.getElementById('password').value,
   display_name:document.getElementById('name').value.trim()
  };
  const {data,error}=await supabase.functions.invoke('bootstrap-manager',{body});
  if(error){show('Erreur : '+error.message);return}
  if(data?.error){show(data.error);return}
  show('Compte Manager créé. Retourne maintenant à la page de connexion et utilise Accès Manager.',true);
  form.reset();
 }catch(err){show('Erreur : '+(err?.message||err))}
 finally{btn.disabled=false;btn.textContent='Créer le compte Manager'}
});
</script>
</body>
</html>
